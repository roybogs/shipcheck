name: Bug report
description: Report an incorrect ShipCheck result or Action failure.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets and private artifact URLs before posting logs.
  - type: input
    id: artifact_type
    attributes:
      label: Artifact type
      placeholder: .app, .dmg, .zip, or .pkg
    validations:
      required: true
  - type: input
    id: runner
    attributes:
      label: macOS runner
      placeholder: macos-14
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the ShipCheck summary or sanitized receipt checks.
    validations:
      required: true
